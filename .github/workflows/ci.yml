name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  PNPM_VERSION: "10.32.1"
  RUST_BACKTRACE: "1"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: crates/cratebay-gui
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: crates/cratebay-gui
        run: pnpm run build

      - name: Lint
        working-directory: crates/cratebay-gui
        run: pnpm run lint

      - name: I18n key check
        working-directory: crates/cratebay-gui
        run: pnpm run check:i18n

      - name: Unit tests
        working-directory: crates/cratebay-gui
        run: pnpm run test:unit

  release-scripts:
    name: Release Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test release helpers
        run: node --test scripts/release/*.test.mjs

      - name: Smoke generated version and updater manifests
        env:
          CRATEBAY_RELEASE_TAG: v1.2.3
          CRATEBAY_UPDATE_REPOSITORY: nicepkg/CrateBay
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          node scripts/release/prepare-app-version-from-tag.mjs \
            v1.2.3 \
            --tauri-config "$tmp/tauri.version.generated.conf.json" \
            --json
          printf 'fake-app' > "$tmp/CrateBay-v1.2.3-macOS-aarch64.app.tar.gz"
          printf 'fake-signature' > "$tmp/CrateBay-v1.2.3-macOS-aarch64.app.tar.gz.sig"
          printf '# CrateBay v1.2.3\n\nSynthetic CI notes.\n' > "$tmp/notes.md"
          node scripts/release/create-tauri-updater-manifest.mjs \
            "$tmp" \
            "$tmp/latest.json" \
            "$tmp/notes.md"
          node -e 'const manifest = require(process.argv[1]); if (manifest.version !== "1.2.3" || !manifest.platforms["darwin-aarch64"]) process.exit(1)' "$tmp/latest.json"

  guards:
    name: Static Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Product surface guard
        run: ./scripts/product-surface-guard.sh

      - name: Runtime native guard
        run: ./scripts/runtime-native-guard.sh

      - name: Tauri command surface guard
        run: ./scripts/verify-tauri-command-surface.sh

  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Core workspace clippy
        run: cargo clippy --workspace --exclude cratebay-gui --exclude cratebay-vz --all-targets -- -D warnings

      - name: GUI backend clippy
        run: cargo clippy -p cratebay-gui --all-targets -- -D warnings

      - name: Core workspace tests
        run: cargo test --workspace --exclude cratebay-gui --exclude cratebay-vz -- --test-threads=1

      - name: GUI backend tests
        run: cargo test -p cratebay-gui -- --test-threads=1

  vz-runner:
    name: VZ Runner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: VZ runner clippy
        run: cargo clippy -p cratebay-vz --all-targets -- -D warnings

      - name: VZ runner tests
        run: cargo test -p cratebay-vz -- --test-threads=1

  cli-contract:
    name: CLI JSON Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install CLI contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p cratebay-cli

      - name: Verify JSON contracts used by LiveAgent
        run: |
          set -euo pipefail
          bin="target/debug/cratebay"
          test -x "$bin"
          "$bin" --json system info | jq -e '.version and .platform and .arch'
          "$bin" --json system engine-status | jq -e '.engine'
          "$bin" --json runtime status | jq -e '.state and .socketPath'

  diff-hygiene:
    name: Diff Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: git diff --check
