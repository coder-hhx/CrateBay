name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.9.1
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  PNPM_VERSION: "10.32.1"

jobs:
  metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Runtime native guard
        run: ./scripts/runtime-native-guard.sh

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release/prepare-app-version-from-tag.mjs "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT" --json

  headless:
    name: Headless ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: metadata
    env:
      CRATEBAY_RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      CRATEBAY_APP_VERSION: ${{ needs.metadata.outputs.app_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            zip \
            patchelf \
            qemu-system-x86 \
            squashfs-tools

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf squashfs zig zstd

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install protoc zig -y --no-progress

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --force

      - name: Install Zig on Linux
        if: runner.os == 'Linux'
        run: bash scripts/install-zig.sh

      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-${{ matrix.target }}

      - name: Build headless runtime assets
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          case "$RUNNER_OS" in
            macOS)
              rustup target add "${arch}-unknown-linux-musl"
              bash scripts/build-runtime-assets-alpine.sh "$arch"
              bash scripts/prepare-tauri-external-bins.sh "${{ matrix.target }}"
              ;;
            Linux)
              rustup target add "${arch}-unknown-linux-musl"
              bash scripts/build-runtime-assets-alpine.sh "$arch"
              bash scripts/build-runtime-assets-linux.sh "$arch"
              ;;
            Windows)
              rustup target add "${arch}-unknown-linux-musl"
              bash scripts/build-runtime-assets-wsl.sh "$arch"
              ;;
          esac

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p cratebay-cli

      - name: Package headless runtime
        shell: bash
        run: |
          set -euo pipefail
          asset="CrateBay-${CRATEBAY_RELEASE_TAG}-headless-${{ matrix.platform }}.zip"
          binary="target/${{ matrix.target }}/release/cratebay${{ matrix.ext }}"
          runtime_arch="${{ matrix.target }}"
          runtime_arch="${runtime_arch%%-*}"
          test -f "$binary"
          rm -rf staging dist
          mkdir -p staging/bin dist
          cp "$binary" "staging/bin/cratebay${{ matrix.ext }}"
          case "$RUNNER_OS" in
            macOS)
              runner="crates/cratebay-gui/src-tauri/bin/cratebay-vz-${{ matrix.target }}"
              test -f "$runner"
              cp "$runner" staging/bin/cratebay-vz
              chmod 0755 staging/bin/cratebay-vz
              mkdir -p staging/resources
              cp -a crates/cratebay-gui/src-tauri/runtime-images staging/resources/runtime-images
              ;;
            Linux)
              mkdir -p staging/resources
              cp -a crates/cratebay-gui/src-tauri/runtime-images staging/resources/runtime-images
              cp -a crates/cratebay-gui/src-tauri/runtime-linux staging/resources/runtime-linux
              ;;
            Windows)
              mkdir -p staging/resources
              cp -a crates/cratebay-gui/src-tauri/runtime-wsl staging/resources/runtime-wsl
              ;;
          esac
          cat > staging/README.txt <<EOF
          CrateBay headless sandbox backend for LiveAgent.

          Install this package through LiveAgent's Sandbox panel or CrateBayInstall tool.
          Version: ${CRATEBAY_RELEASE_TAG}
          Platform: ${{ matrix.platform }}
          Runtime: CrateBay Engine (containerd/runc/CNI with compatibility API adapter)
          EOF
          test -x "staging/bin/cratebay${{ matrix.ext }}"
          test -s staging/README.txt
          case "$RUNNER_OS" in
            macOS)
              test -x staging/bin/cratebay-vz
              test -f "staging/resources/runtime-images/cratebay-runtime-${runtime_arch}/vmlinuz"
              test -f "staging/resources/runtime-images/cratebay-runtime-${runtime_arch}/initramfs"
              ;;
            Linux)
              test -f "staging/resources/runtime-images/cratebay-runtime-${runtime_arch}/vmlinuz"
              test -f "staging/resources/runtime-images/cratebay-runtime-${runtime_arch}/initramfs"
              test -x "staging/resources/runtime-linux/cratebay-runtime-linux-${runtime_arch}/qemu-system-${runtime_arch}"
              ;;
            Windows)
              test -f "staging/resources/runtime-wsl/cratebay-runtime-wsl-${runtime_arch}/rootfs.tar"
              ;;
          esac
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path staging/* -DestinationPath dist/$asset -Force"
          else
            (cd staging && zip -qr "../dist/$asset" .)
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            hash="$(sha256sum "dist/$asset" | awk '{print $1}')"
          else
            hash="$(shasum -a 256 "dist/$asset" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$hash" "$asset" > "dist/$asset.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: cratebay-headless-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: metadata
    env:
      CRATEBAY_APP_VERSION: ${{ needs.metadata.outputs.app_version }}
      CRATEBAY_RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      CRATEBAY_UPDATE_REPOSITORY: ${{ github.repository }}
      CRATEBAY_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: macOS-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: Linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: Windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            qemu-system-x86 \
            squashfs-tools

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf squashfs zig

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress

      - name: Install cargo-zigbuild
        if: runner.os != 'Windows'
        run: cargo install cargo-zigbuild --locked --force

      - name: Install Zig on Linux
        if: runner.os == 'Linux'
        run: bash scripts/install-zig.sh

      - name: Build bundled runtime assets
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)
              arch="${{ matrix.target }}"
              arch="${arch%%-*}"
              rustup target add "${arch}-unknown-linux-musl"
              bash scripts/build-runtime-assets-alpine.sh "$arch"
              bash scripts/prepare-tauri-external-bins.sh "${{ matrix.target }}"
              ;;
            Linux)
              rustup target add x86_64-unknown-linux-musl
              bash scripts/build-runtime-assets-alpine.sh x86_64
              bash scripts/build-runtime-assets-linux.sh x86_64
              ;;
            Windows)
              bash scripts/build-runtime-assets-wsl.sh x86_64
              ;;
          esac

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/cratebay-gui/src-tauri
          key: desktop-${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: crates/cratebay-gui
        run: pnpm install --frozen-lockfile

      - name: Prepare generated Tauri version config
        working-directory: crates/cratebay-gui
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$CRATEBAY_RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json

      - name: Build Tauri desktop
        working-directory: crates/cratebay-gui
        run: pnpm tauri build --config "$CRATEBAY_TAURI_VERSION_CONFIG" --target ${{ matrix.target }}

      - name: Stage desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle_root="target/${{ matrix.target }}/release/bundle"
          case "$RUNNER_OS" in
            macOS)
              dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
              updater_path="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
              test -n "$dmg_path"
              test -n "$updater_path"
              test -f "$updater_path.sig"
              cp "$dmg_path" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}.dmg"
              cp "$updater_path" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}.app.tar.gz"
              cp "$updater_path.sig" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}.app.tar.gz.sig"
              ;;
            Linux)
              appimage_path="$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
              deb_path="$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' -print -quit)"
              test -n "$appimage_path"
              test -n "$deb_path"
              test -f "$appimage_path.sig"
              cp "$appimage_path" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}.AppImage"
              cp "$appimage_path.sig" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}.AppImage.sig"
              cp "$deb_path" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}.deb"
              ;;
            Windows)
              msi_path="$(find "$bundle_root/msi" -maxdepth 1 -name '*.msi' -print -quit)"
              setup_path="$(find "$bundle_root/nsis" -maxdepth 1 -name '*.exe' -print -quit)"
              test -n "$msi_path"
              test -n "$setup_path"
              test -f "$setup_path.sig"
              cp "$msi_path" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}.msi"
              cp "$setup_path" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}-Setup.exe"
              cp "$setup_path.sig" "dist/CrateBay-${CRATEBAY_RELEASE_TAG}-${{ matrix.platform }}-Setup.exe.sig"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: cratebay-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [metadata, headless, desktop]
    env:
      CRATEBAY_RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      CRATEBAY_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.release_tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cratebay-*
          path: artifacts

      - name: Flatten release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -maxdepth 3 -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "dist/$(basename "$file")"
          done
          find dist -type f | sort

      - name: Verify release artifacts
        run: bash scripts/verify-release-artifacts.sh --mode downloaded --artifacts-root dist

      - name: Generate release notes
        run: |
          set -euo pipefail
          printf '# CrateBay %s\n\nRelease %s.\n' "$CRATEBAY_RELEASE_TAG" "$CRATEBAY_RELEASE_TAG" > fallback-notes.md
          node scripts/release/create-ai-release-notes.mjs \
            "$CRATEBAY_RELEASE_TAG" \
            release-notes.md \
            fallback-notes.md

      - name: Generate updater manifest
        run: node scripts/release/create-tauri-updater-manifest.mjs dist dist/latest.json release-notes.md

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          (cd dist && sha256sum * | sort) > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: CrateBay ${{ needs.metadata.outputs.release_tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          files: |
            dist/*
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
